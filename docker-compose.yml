services:
  brain-evoforge:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sqlite3; sqlite3.connect(\"data/evoforge.sqlite3\").execute(\"select 1\").fetchone()'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
