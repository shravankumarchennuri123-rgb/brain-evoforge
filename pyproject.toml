[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-evoforge"
version = "0.1.0"
description = "Guardrailed autonomous research and submission orchestrator for WorldQuant BRAIN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
llm = ["openai>=1.50,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
wq-evoforge = "wq_evo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
